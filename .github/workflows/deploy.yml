name: Deploy

# Builds the static site on every push and pull request, and on pushes to main
# deploys it to the Azure VM behind alma.inc.
#
# Deploy path: azure/login authenticates with GitHub's OIDC token (no stored
# keys — the federated credential on the `alma-landing-github-deploy` app only
# trusts this repo's main branch), then `az vm run-command` runs the VM's own
# autodeploy script, which fetches origin/main, builds, and syncs the webroot.
# Finally every built file is checksum-verified over HTTPS. See DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys rather than cancel them so a sha is never half-deployed. PR
# builds are only checks, so cancel superseded ones.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages through the shared layout
        # Not .build: upload-artifact ignores hidden paths by default.
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to alma.inc
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run autodeploy on the VM
        id: remote
        run: |
          out="$(az vm run-command invoke \
            --resource-group alma-landing-rg \
            --name alma-landing-vm \
            --command-id RunShellScript \
            --scripts @deploy/gha-remote-deploy.sh \
            --parameters "$GITHUB_SHA" \
            --query 'value[0].message' -o tsv)"
          printf '%s\n' "$out"
          if ! grep -q '^status=ok$' <<<"$out"; then
            echo "::error::remote deploy did not complete; see output above"
            exit 1
          fi
          echo "sha=$(sed -n 's/^deployed=//p' <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Verify live site against the build
        if: steps.remote.outputs.sha == github.sha
        run: bash deploy/verify-live.sh "$RUNNER_TEMP/site"

      - name: Skip verification (VM already ahead)
        if: steps.remote.outputs.sha != github.sha
        run: echo "::notice::VM is at ${{ steps.remote.outputs.sha }}, which is newer than ${{ github.sha }}; the run for that commit verifies it."
