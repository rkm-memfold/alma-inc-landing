server {

    server_name alma.inc www.alma.inc;

    root /var/www/alma;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache for static assets, no cache for the HTML itself
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alma.inc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alma.inc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.alma.inc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = alma.inc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name alma.inc www.alma.inc;
    return 404; # managed by Certbot




}