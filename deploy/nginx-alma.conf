server {

    server_name alma.inc www.alma.inc;

    root /var/www/alma;
    index index.html;

    # One canonical host. www served the same pages at 200, so the two
    # hostnames split their signals for no benefit; the canonical tags said
    # apex, and this makes the server agree with them.
    if ($host = www.alma.inc) {
        return 301 https://alma.inc$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Window bodies the desktop fetches for routes a page did not ship. They
    # are already disallowed in robots.txt, but Disallow only stops crawling:
    # a URL discovered elsewhere can still be indexed bare. This stops that.
    location /windows/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Long cache for static assets, no cache for the HTML itself
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml font/ttf application/x-font-ttf;
    gzip_min_length 256;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alma.inc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alma.inc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.alma.inc) {
        return 301 https://alma.inc$request_uri;
    } # managed by Certbot


    if ($host = alma.inc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name alma.inc www.alma.inc;
    return 404; # managed by Certbot




}