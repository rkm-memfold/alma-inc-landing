server {

    server_name alma.inc www.alma.inc;

    # The arcade's front door: /paint/ and /chess/ (and the Django admin).

    include snippets/alma-backend-locations.conf;

    root /var/www/alma;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Invitation short links: alma.inc/invitation/<code> answers with the
    # Clerk ticket URL stored by Convex when the invitation was created.
    location /invitation/ {
        return 302 https://outstanding-tortoise-55.convex.site$request_uri;
    }

    # The update feed, same-origin so /invite can offer the current build.
    location = /appcast.xml {
        proxy_pass https://stalmaotaprodeus2.blob.core.windows.net/updates/appcast.xml;
        proxy_ssl_server_name on;
    }

    # The build itself, downloaded from this domain; the bytes come from the
    # same store the update feed names.
    location /download/ {
        proxy_pass https://stalmaotaprodeus2.blob.core.windows.net/updates/;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # Long cache for static assets, no cache for the HTML itself
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alma.inc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alma.inc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.alma.inc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = alma.inc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name alma.inc www.alma.inc;
    return 404; # managed by Certbot




}