# Included from the alma vhost's HTTPS server block.
# Proxies the Django backend; everything else stays static from /var/www/alma.

location = /waitlist {
    limit_req zone=waitlist burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Django admin static assets (collectstatic output served by whitenoise).
# '^~' is required: the vhost's `location ~* \.(png|...|woff2?)$` regex would
# otherwise win over a plain prefix match and serve unfold's icon font out of
# the static webroot, where it does not exist (404, no admin icons).
location ^~ /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
