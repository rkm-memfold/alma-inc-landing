<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Alma</title>
    <meta name="description" content="Get Alma for your Mac.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/client-logomark-dark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/client-logomark-dark.png">
    <meta property="og:title" content="Join Alma">
    <meta property="og:description" content="Get Alma for your Mac.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://alma.inc/og-alma-wordmark.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <style>
      :root {
        color-scheme: light;
        --ink: #0d0818;
        --muted: rgba(13, 8, 24, 0.55);
        --ground: #eeedf3;
        --edge: rgba(13, 8, 24, 0.07);
        --accent: #7960cd;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: var(--ground); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      /* Your renderer, mounted full-bleed with cover so its 16:9 field fills
         the viewport and keeps its aspect on any screen. */
      canvas#ambient {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: max(100vw, 177.78vh); height: max(100vh, 56.25vw);
        z-index: 0; pointer-events: none;
      }
      main {
        position: relative; z-index: 1;
        width: min(23rem, calc(100% - 40px));
        padding: 18px; border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: blur(30px) saturate(1.6);
        backdrop-filter: blur(30px) saturate(1.6);
        border: 1px solid var(--edge);
        box-shadow: 0 20px 48px rgba(13, 8, 24, 0.14);
      }
      img.mark { width: 34px; height: 34px; display: block; margin: 0 0 12px; }
      h1 { font-size: 18px; font-weight: 590; letter-spacing: -0.01em; margin: 0 0 4px; }
      #lead { color: var(--muted); margin: 0 0 14px; }
      #lead strong { color: var(--ink); font-weight: 500; }
      form { display: flex; gap: 8px; flex-wrap: wrap; }
      input[type="email"] {
        flex: 1 1 11rem; height: 38px; padding: 0 12px; border-radius: 8px;
        border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.9);
        font: inherit; color: var(--ink);
      }
      input[type="email"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(121, 96, 205, 0.25); }
      button, a.button {
        display: inline-flex; align-items: center; justify-content: center;
        height: 38px; padding: 0 18px; border: 0; border-radius: 8px;
        background: var(--ink); color: #ffffff; font: inherit; font-weight: 500;
        text-decoration: none; cursor: pointer;
      }
      button[disabled] { opacity: 0.45; cursor: default; }
      a[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
      .note { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; min-height: 18px; }
      @media (max-width: 480px) {
        main { padding: 16px; }
        button, form, a.button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <main>
      <img class="mark" alt="Alma" src="/client-logomark-dark.svg">
      <h1>Join Alma</h1>
      <p id="lead">Enter your email and get Alma for your Mac.</p>
      <form id="form">
        <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        <button id="submit" type="submit">Continue</button>
      </form>
      <div id="done" hidden>
        <a id="download" class="button" href="#" aria-disabled="true">Get Alma</a>
      </div>
      <p class="note" id="note"></p>
      <noscript><p class="note">This page needs JavaScript to sign you up.</p></noscript>
    </main>
    <script src="/page/alma-art.js" defer></script>
    <script>
      const code = window.location.pathname.split("/").filter(Boolean).pop() ?? "";
      const lead = document.getElementById("lead");
      const note = document.getElementById("note");
      const form = document.getElementById("form");
      const email = document.getElementById("email");
      const submit = document.getElementById("submit");
      const done = document.getElementById("done");
      const download = document.getElementById("download");

      const CLOSED = {
        expired: "This link has expired. Ask whoever shared it for a fresh one.",
        full: "This link has admitted everyone it can. Ask for a fresh one.",
        unknown: "This link isn't one we recognise. Check it, or ask for a fresh one.",
      };

      function closed(message) {
        lead.textContent = message;
        form.hidden = true;
        note.textContent = "";
      }

      // Point the download at the build the update feed ships, served from
      // this domain, then reveal it. Used for the already-has-access answer.
      async function offerDownload(message) {
        lead.textContent = message;
        form.hidden = true;
        done.hidden = false;
        try {
          const response = await fetch("/appcast.xml", { cache: "no-store" });
          const xml = await response.text();
          const feed = new DOMParser().parseFromString(xml, "application/xml");
          const stable = [...feed.querySelectorAll("item")].find(
            (item) => !item.getElementsByTagName("sparkle:channel").length,
          );
          const enclosure = stable?.querySelector("enclosure")?.getAttribute("url");
          if (!enclosure) throw new Error("no stable build");
          download.href = "/download/" + new URL(enclosure).pathname.split("/").pop();
          download.removeAttribute("aria-disabled");
        } catch {
          note.textContent = "The download isn't reachable right now. Refresh in a moment.";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        note.textContent = "Setting up your access…";
        try {
          const response = await fetch("/api/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code, email: email.value }),
          });
          if (!response.ok) throw new Error(String(response.status));
          const result = await response.json();
          if (result.outcome === "ready" && result.url) {
            note.textContent = "Taking you to your download…";
            window.location.href = result.url;
            return;
          }
          if (result.outcome === "have-access") {
            offerDownload("This email already has access.");
            return;
          }
          if (result.outcome === "bad-email") {
            note.textContent = "That doesn't read as an email address. Check it and try again.";
            submit.disabled = false;
            return;
          }
          if (result.outcome in CLOSED) return closed(CLOSED[result.outcome]);
          note.textContent = "That didn't go through. Try again in a moment.";
          submit.disabled = false;
        } catch {
          note.textContent = "That didn't go through. Try again in a moment.";
          submit.disabled = false;
        }
      });

      if (!/^[0-9a-f]{16}$/.test(code)) closed(CLOSED.unknown);
    </script>
  </body>
</html>
