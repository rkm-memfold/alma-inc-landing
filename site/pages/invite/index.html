<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You'"'"'re invited to Alma</title>
    <meta name="description" content="Your invitation to Alma.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/client-logomark-dark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/client-logomark-dark.png">
    <meta property="og:title" content="You'"'"'re invited to Alma">
    <meta property="og:description" content="Accept your invitation and get Alma for your Mac.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://alma.inc/page/og-alma-invite.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preload" as="image" href="/page/alma-art-ref.png">
    <link rel="stylesheet" href="/page/alma-invite.css">
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <main class="card" id="card" data-state="working">
      <img class="mark" alt="Alma" src="/page/alma-app-icon.png" srcset="/page/alma-app-icon@2x.png 2x">

      <div class="state" data-for="form">
        <h1>Join Alma</h1>
        <p class="sub">Enter your email to get Alma for your Mac.</p>
        <form id="form">
          <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
          <p class="err" id="err"></p>
          <button class="btn" id="submit" type="submit">Continue</button>
        </form>
      </div>

      <div class="state" data-for="working">
        <h1>Setting up your account</h1>
        <p class="sub">
          <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>One moment.
        </p>
      </div>

      <div class="state" data-for="ready">
        <h1>You're in</h1>
        <p class="sub" id="ready-sub"></p>
        <a class="btn" id="download" href="#" aria-disabled="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download Alma
        </a>
        <button class="linkbtn" id="open" type="button" hidden>Already have Alma? Open it</button>
      </div>

      <div class="state" data-for="closed">
        <h1 id="closed-title"></h1>
        <p class="sub" id="closed-sub"></p>
      </div>

      <noscript><p class="sub">This page needs JavaScript to continue.</p></noscript>
    </main>
    <script src="/page/alma-art.js" defer></script>
    <script src="https://clerk.alma.inc/npm/@clerk/clerk-js@5/dist/clerk.browser.js" data-clerk-publishable-key="pk_live_Y2xlcmsuYWxtYS5pbmMk" defer></script>
    <script src="/page/alma-invite.js" defer></script>
  </body>
</html>
