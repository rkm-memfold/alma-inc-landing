<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Request early access to Alma, an AI-native computer interface for controlling work across existing apps with natural language.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://alma.inc/v2/">
    <link rel="icon" href="/almanac_logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/almanac_logo.jpg">
    <title>Alma - Early access</title>

    <style>
      :root {
        color-scheme: light;
        --text: #000;
        --muted: #5f5f5f;
        --rule: #dedede;
        --page: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        background: var(--page);
      }

      .page {
        display: grid;
        min-height: 100svh;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: clamp(28px, 5vh, 48px) clamp(24px, 6vw, 80px);
      }

      .brand {
        margin: 0;
        font-size: clamp(1.35rem, 2vw, 1.7rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0;
      }

      main {
        align-self: center;
        width: min(100%, 780px);
        padding: clamp(28px, 6vh, 64px) 0;
      }

      .kicker {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .statement {
        margin: 0 0 clamp(22px, 4vh, 36px);
        max-width: 760px;
        font-size: clamp(2rem, 4.4vw, 3.75rem);
        font-weight: 520;
        line-height: 1.04;
        letter-spacing: 0;
      }

      .copy {
        max-width: 650px;
        color: #171717;
        font-size: clamp(0.98rem, 1.1vw, 1.08rem);
        line-height: 1.48;
      }

      .copy p {
        margin: 0;
      }

      .waitlist {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        width: min(100%, 540px);
        margin-top: clamp(24px, 4vh, 36px);
        gap: 14px;
      }

      .field {
        border-bottom: 1px solid var(--text);
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      input {
        width: 100%;
        min-width: 0;
        border: 0;
        padding: 8px 0 13px;
        color: var(--text);
        background: transparent;
        font: inherit;
        outline: 0;
      }

      input::placeholder {
        color: #8a8a8a;
      }

      button {
        min-height: 45px;
        border: 1px solid var(--text);
        padding: 0 18px;
        color: var(--page);
        background: var(--text);
        font: inherit;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        color: var(--text);
        background: var(--page);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      footer p {
        margin: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }

      .social {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .social a {
        display: inline-flex;
        width: 22px;
        height: 22px;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }

      .social a:hover,
      .social a:focus-visible {
        color: var(--text);
      }

      .social svg {
        display: block;
        fill: currentColor;
      }

      .social-x svg {
        width: 17px;
        height: 17px;
      }

      .social-instagram svg,
      .social-linkedin svg {
        width: 18px;
        height: 18px;
      }

      @media (max-width: 640px) {
        .page {
          padding: 24px;
        }

        main {
          align-self: start;
          padding: clamp(42px, 8vh, 60px) 0 28px;
        }

        .statement {
          font-size: clamp(1.8rem, 8vw, 2.65rem);
          line-height: 1.08;
          margin-bottom: 22px;
        }

        .copy {
          font-size: 0.94rem;
          line-height: 1.4;
        }

        .waitlist {
          grid-template-columns: 1fr;
          gap: 14px;
          margin-top: 24px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header aria-labelledby="site-title">
        <h1 id="site-title" class="brand">ALMA</h1>
      </header>

      <main>
        <section aria-label="Alma early access">
          <p class="kicker">Early access</p>
          <p class="statement">Be early to the next computer interface.</p>

          <div class="copy">
            <p>AI changes how computers can work with people. Alma turns intent and context into the new starting point.</p>
          </div>

          <form class="waitlist" action="/waitlist" method="post">
            <div class="field">
              <label for="email">Enter your email to request a place</label>
              <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
            </div>
            <button type="submit">Save my place</button>
          </form>
        </section>
      </main>

      <footer>
        <p>Coming soon.</p>
        <nav class="social" aria-label="Social links">
          <a class="social-x" href="https://x.com/thinkwithalma" target="_blank" rel="noopener noreferrer" aria-label="Alma on X">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.67l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.11l11.97 15.64Z"/>
            </svg>
          </a>
          <a class="social-instagram" href="https://www.instagram.com/thinkwithalma" target="_blank" rel="noopener noreferrer" aria-label="Alma on Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM12 7.25A4.75 4.75 0 1 1 12 16.75 4.75 4.75 0 0 1 12 7.25Zm0 2A2.75 2.75 0 1 0 12 14.75 2.75 2.75 0 0 0 12 9.25Zm5.1-2.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/>
            </svg>
          </a>
          <a class="social-linkedin" href="https://www.linkedin.com/company/tryalmanac/" target="_blank" rel="noopener noreferrer" aria-label="Alma on LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.98 3.5A2.5 2.5 0 1 1 4.98 8.5a2.5 2.5 0 0 1 0-5ZM3 21h4V9.75H3V21Zm6.25-11.25H13v1.54h.05c.52-.99 1.8-2.04 3.7-2.04 3.96 0 4.69 2.61 4.69 6V21h-4v-5.1c0-1.22-.02-2.78-1.69-2.78-1.7 0-1.96 1.33-1.96 2.69V21h-4V9.75Z"/>
            </svg>
          </a>
        </nav>
      </footer>
    </div>
  </body>
</html>
